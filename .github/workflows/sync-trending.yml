name: Sync Trending Content

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-trending:
    runs-on: ubuntu-latest
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_TRENDING_CONTENT_DB_ID: ${{ secrets.NOTION_TRENDING_CONTENT_DB_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install notion-client python-dotenv requests

      - name: Debug - Check env vars
        run: |
          echo "NOTION_API_KEY is set: ${{ secrets.NOTION_API_KEY != '' }}"
          echo "NOTION_TRENDING_CONTENT_DB_ID is set: ${{ secrets.NOTION_TRENDING_CONTENT_DB_ID != '' }}"

      - name: Run trending sync
        run: |
          cd scripts/trending
          python run_daily.py
